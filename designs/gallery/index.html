<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Portfolio — Sanjay Meher</title>
<meta name="description" content="A collection of design work by Sanjay Meher, organized by category.">
<style>
  :root{
    --bg: #0c0e12;
    --panel: #15181f;
    --panel-2: #1c2029;
    --line: #262b35;
    --text: #eef0f3;
    --muted: #8b909c;
    --accent: #5ee6c8;
    --accent-dim: rgba(94,230,200,0.14);
    --danger: #ff6b6b;
    --radius: 8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height:100vh;
  }

  header{
    padding: 64px 20px 40px;
    text-align:center;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(94,230,200,0.07), transparent);
  }
  header .eyebrow{
    color: var(--accent);
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 10px;
  }
  header h1{
    margin:0 0 10px;
    font-size: clamp(2rem, 5vw, 3rem);
    letter-spacing: -0.02em;
    font-weight: 700;
  }
  header h1 span{ color: var(--accent); }
  header p{
    margin: 0 auto;
    max-width: 560px;
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.5;
  }

  main{
    max-width: 1300px;
    margin: 0 auto;
    padding: 8px 20px 40px;
  }

  #status{
    text-align:center;
    color: var(--muted);
    padding: 90px 20px;
    font-size: 0.95rem;
  }
  #status.error{ color: var(--danger); }

  .category{
    margin-top: 56px;
  }
  .category-head{
    display:flex;
    align-items:baseline;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .category-head h2{
    margin:0;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .category-head .count{
    color: var(--muted);
    font-size: 0.82rem;
  }

  /* Masonry via CSS columns so images keep their natural aspect ratio */
  .masonry{
    column-count: 1;
    column-gap: 14px;
  }
  @media (min-width: 560px){ .masonry{ column-count: 2; } }
  @media (min-width: 860px){ .masonry{ column-count: 3; } }
  @media (min-width: 1180px){ .masonry{ column-count: 4; } }

  .card{
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    margin: 0 0 14px;
    position:relative;
    background: var(--panel);
    border:1px solid var(--line);
    border-radius: var(--radius);
    overflow:hidden;
    cursor: zoom-in;
    transition: border-color .15s ease, transform .15s ease;
  }
  .card:hover{ border-color:#3a4150; transform: translateY(-2px); }

  .card img{
    display:block;
    width:100%;
    height:auto; /* preserves original aspect ratio */
  }

  .badge-num{
    position:absolute;
    top:8px; left:8px;
    background: rgba(12,14,18,0.78);
    color: var(--text);
    font-size: 0.72rem;
    font-weight:600;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    pointer-events:none;
  }

  /* Lightbox */
  #lightbox{
    position:fixed; inset:0;
    background: rgba(6,7,9,0.94);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 100;
    padding: 40px 20px;
  }
  #lightbox.show{ display:flex; }
  #lightbox img{
    max-width:100%;
    max-height:85vh;
    border-radius: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  #lightbox .lb-close{
    position:absolute;
    top:18px; right:22px;
    color: var(--text);
    font-size: 1.8rem;
    cursor:pointer;
    background:none;
    border:none;
    line-height:1;
  }
  #lightbox .lb-caption{
    position:absolute;
    bottom: 24px;
    color: var(--muted);
    font-size: 0.85rem;
  }

  footer{
    text-align:center;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 40px 16px 30px;
    border-top: 1px solid var(--line);
    margin-top: 40px;
  }
  footer a{ color: var(--accent); text-decoration:none; }
</style>
</head>

<header>
  <div class="eyebrow">Selected Work</div>
  <h1>Design <span>Portfolio</span></h1>
  <p>A collection of design work, organized by category. Tap any piece to view it full size.</p>
</header>

<main>

  <div class="lb-caption" id="lbCaption"></div>
</div>

<footer>
  Built by <a href="https://cggodotassets.shop" target="_blank" rel="noopener">Sanjay Meher</a>
</footer>

  const statusEl = document.getElementById('status');
  const categoriesEl = document.getElementById('categories');
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbCaption = document.getElementById('lbCaption');
  const lbClose = document.getElementById('lbClose');

  function openLightbox(url, num){
    lbImg.src = url;
    lbCaption.textContent = `Design #${num}`;
    lightbox.classList.add('show');
  }
  function closeLightbox(){
    lightbox.classList.remove('show');
    lbImg.src = "";
  }
  lbClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e)=>{ if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeLightbox(); });

  function buildCard(item){
    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.src = item.u;
    img.alt = `Design ${item.p}`;
    img.loading = 'lazy';

    const badge = document.createElement('div');
    badge.className = 'badge-num';
    badge.textContent = '#' + item.p;

    card.appendChild(img);
    card.appendChild(badge);
    card.addEventListener('click', () => openLightbox(item.u, item.p));
    return card;
  }

  function buildSection(categoryName, items){
    const section = document.createElement('section');
    section.className = 'category';

    const head = document.createElement('div');
    head.className = 'category-head';
    const h2 = document.createElement('h2');
    h2.textContent = categoryName;
    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = `${items.length} piece${items.length === 1 ? '' : 's'}`;
    head.appendChild(h2);
    head.appendChild(count);

    const masonry = document.createElement('div');
    masonry.className = 'masonry';
    items.forEach(item => masonry.appendChild(buildCard(item)));

    section.appendChild(head);
    section.appendChild(masonry);
    return section;
  }

  function render(){
    if(!PORTFOLIO || PORTFOLIO.length === 0){
      statusEl.textContent = 'No designs found yet. Check back soon.';
      return;
    }

    // Sort by curated sequence, then group by category
    // while preserving each category's first-appearance order.
    const sorted = [...PORTFOLIO].sort((a,b) => a.p - b.p);

    const order = [];
    const groups = {};
    for(const item of sorted){
      if(!groups[item.c]){
        groups[item.c] = [];
        order.push(item.c);
      }
      groups[item.c].push(item);
    }

    statusEl.style.display = 'none';
    categoriesEl.style.display = 'block';

    order.forEach(categoryName => {
      categoriesEl.appendChild(buildSection(categoryName, groups[categoryName]));
    });
  }

  render();
})();
