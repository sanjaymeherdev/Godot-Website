<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arrange — Sanjay Meher</title>
<meta name="description" content="Drag to reorder designs, then export the arrangement as JSON.">
<style>
  :root{
    --bg: #0c0e12;
    --panel: #15181f;
    --panel-2: #1c2029;
    --line: #262b35;
    --text: #eef0f3;
    --muted: #8b909c;
    --accent: #5ee6c8;
    --accent-dim: rgba(94,230,200,0.14);
    --danger: #ff6b6b;
    --radius: 8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height:100vh;
    padding-bottom: 100px; /* room for sticky bar */
  }

  header{
    padding: 40px 20px 24px;
    text-align:center;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(94,230,200,0.07), transparent);
  }
  header .eyebrow{
    color: var(--accent);
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 10px;
  }
  header h1{
    margin:0 0 10px;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    letter-spacing: -0.02em;
    font-weight: 700;
  }
  header h1 span{ color: var(--accent); }
  header p{
    margin: 0 auto;
    max-width: 560px;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.5;
  }

  main{
    max-width: 1300px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }

  #status{
    text-align:center;
    color: var(--muted);
    padding: 90px 20px;
    font-size: 0.95rem;
  }
  #status.error{ color: var(--danger); }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }

  .card{
    position:relative;
    background: var(--panel);
    border:1px solid var(--line);
    border-radius: var(--radius);
    overflow:hidden;
    cursor: grab;
    touch-action: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .card:active{ cursor: grabbing; }
  .card:hover{ border-color:#3a4150; }

  .card .thumb-wrap{
    aspect-ratio: 1/1;
    width:100%;
    overflow:hidden;
    background: var(--panel-2);
  }
  .card img{
    width:100%; height:100%;
    object-fit: cover;
    display:block;
    pointer-events:none; /* let drag handle clicks, avoid native image drag */
    -webkit-user-drag:none;
  }

  .badge-num{
    position:absolute;
    top:8px; left:8px;
    background: rgba(12,14,18,0.85);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight:700;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    pointer-events:none;
    z-index:2;
  }

  .drag-handle{
    position:absolute;
    top:8px; right:8px;
    width: 26px; height:26px;
    background: rgba(12,14,18,0.78);
    border: 1px solid var(--line);
    border-radius: 6px;
    display:flex; align-items:center; justify-content:center;
    color: var(--muted);
    pointer-events:none;
    z-index:2;
    font-size: 0.85rem;
  }

  /* SortableJS state classes */
  .sortable-ghost{
    opacity: 0.35;
  }
  .sortable-chosen .thumb-wrap{
    box-shadow: 0 0 0 2px var(--accent) inset;
  }
  .sortable-drag{
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
  }

  /* Sticky action bar */
  #actionbar{
    position:fixed;
    left:0; right:0; bottom:0;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 12px 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    z-index: 50;
  }
  #actionbar .hint{
    color: var(--muted);
    font-size: 0.85rem;
  }

  .btn{
    border:none;
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 0.92rem;
    font-weight:600;
    cursor:pointer;
    transition: opacity .15s ease, transform .1s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--accent); color:#06231d; }
  .btn-primary:hover{ opacity:0.9; }
  .btn-ghost{
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover{ color: var(--text); border-color:#3a4150; }

  /* Lightbox */
  #lightbox{
    position:fixed; inset:0;
    background: rgba(6,7,9,0.94);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 100;
    padding: 40px 20px;
  }
  #lightbox.show{ display:flex; }
  #lightbox img{
    max-width:100%;
    max-height:85vh;
    border-radius: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  #lightbox .lb-close{
    position:absolute;
    top:18px; right:22px;
    color: var(--text);
    font-size: 1.8rem;
    cursor:pointer;
    background:none;
    border:none;
    line-height:1;
  }
  #lightbox .lb-caption{
    position:absolute;
    bottom: 24px;
    color: var(--muted);
    font-size: 0.85rem;
  }

  footer{
    text-align:center;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 30px 16px 16px;
  }
  footer a{ color: var(--accent); text-decoration:none; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Layout Tool</div>
  <h1>Arrange <span>the Set</span></h1>
  <p>Drag the tiles into the order you want. When you're happy with the sequence, export it as JSON and send it back over — that file becomes the final layout order.</p>
</header>

<main>
  <div id="status">Loading designs…</div>
  <div class="grid" id="grid" style="display:none;"></div>
</main>

<div id="actionbar">
  <span class="hint">Drag tiles to reorder</span>
  <button class="btn btn-ghost" id="resetBtn">Reset order</button>
  <button class="btn btn-primary" id="downloadBtn">⬇ Download arrangement (JSON)</button>
</div>

<div id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
  <img id="lbImg" src="" alt="">
  <div class="lb-caption" id="lbCaption"></div>
</div>

<footer>
  Built by <a href="https://cggodotassets.shop" target="_blank" rel="noopener">Sanjay Meher</a>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
(function(){
  const OWNER = "sanjaymeherdev";
  const REPO = "Godot-Website";
  const BRANCH = "main";
  const FOLDER_PATH = "designs/gallery";
  const IMAGE_EXT = /\.(jpe?g|png|gif|webp|avif|svg)$/i;
  const PROBE_TIMEOUT_MS = 8000;

  const statusEl = document.getElementById('status');
  const gridEl = document.getElementById('grid');
  const resetBtn = document.getElementById('resetBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbCaption = document.getElementById('lbCaption');
  const lbClose = document.getElementById('lbClose');

  let originalOrder = []; // array of filenames in the order they were fetched
  let sortableInstance = null;

  function rawUrl(filename){
    return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${FOLDER_PATH}/${encodeURIComponent(filename)}`;
  }

  function openLightbox(url, name){
    lbImg.src = url;
    lbCaption.textContent = name;
    lightbox.classList.add('show');
  }
  function closeLightbox(){
    lightbox.classList.remove('show');
    lbImg.src = "";
  }
  lbClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e)=>{ if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeLightbox(); });

  function renumberBadges(){
    const cards = gridEl.querySelectorAll('.card');
    cards.forEach((card, i) => {
      card.querySelector('.badge-num').textContent = '#' + (i + 1);
    });
  }

  function buildCard(filename, url, position){
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.filename = filename;
    card.dataset.url = url;

    const thumbWrap = document.createElement('div');
    thumbWrap.className = 'thumb-wrap';
    const img = document.createElement('img');
    img.src = url;
    img.alt = filename;
    img.loading = 'lazy';
    img.draggable = false;
    thumbWrap.appendChild(img);

    const badge = document.createElement('div');
    badge.className = 'badge-num';
    badge.textContent = '#' + position;

    const handle = document.createElement('div');
    handle.className = 'drag-handle';
    handle.textContent = '⠿';

    card.appendChild(thumbWrap);
    card.appendChild(badge);
    card.appendChild(handle);

    // Click opens the lightbox; SortableJS only fires drag on real pointer movement,
    // so a plain click/tap still works as a preview.
    card.addEventListener('click', () => openLightbox(url, filename));

    return card;
  }

  function loadImageMeta(url){
    return new Promise((resolve) => {
      let settled = false;
      const probe = new Image();
      const finish = () => { if(!settled){ settled = true; resolve(); } };
      probe.onload = finish;
      probe.onerror = finish;
      setTimeout(finish, PROBE_TIMEOUT_MS);
      probe.src = url;
    });
  }

  function initSortable(){
    if(sortableInstance) sortableInstance.destroy();
    sortableInstance = new Sortable(gridEl, {
      animation: 150,
      delay: 60,
      delayOnTouchOnly: true,
      touchStartThreshold: 4,
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      dragClass: 'sortable-drag',
      onEnd: renumberBadges
    });
  }

  function renderGrid(filenames){
    gridEl.innerHTML = '';
    filenames.forEach((filename, idx) => {
      gridEl.appendChild(buildCard(filename, rawUrl(filename), idx + 1));
    });
    renumberBadges();
    initSortable();
  }

  resetBtn.addEventListener('click', () => {
    renderGrid(originalOrder);
  });

  downloadBtn.addEventListener('click', () => {
    const cards = Array.from(gridEl.querySelectorAll('.card'));
    if(cards.length === 0) return;

    const arrangement = cards.map((card, i) => ({
      position: i + 1,
      filename: card.dataset.filename,
      url: card.dataset.url
    }));

    const payload = {
      exportedAt: new Date().toISOString(),
      count: arrangement.length,
      arrangement
    };

    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().replace(/[:.]/g, '-');
    a.href = url;
    a.download = `arrangement-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  async function loadImages(){
    try{
      const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER_PATH}`;
      const res = await fetch(apiUrl, {
        headers: { 'Accept': 'application/vnd.github+json' }
      });

      if(!res.ok){
        if(res.status === 404){
          throw new Error(`Folder not found. Make sure "${FOLDER_PATH}" exists in the repo.`);
        }
        if(res.status === 403){
          throw new Error('GitHub API rate limit reached. Please try again in a bit.');
        }
        throw new Error(`GitHub API error (${res.status})`);
      }

      const data = await res.json();
      const files = data
        .filter(item => item.type === 'file' && IMAGE_EXT.test(item.name))
        .sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'}))
        .map(item => item.name);

      if(files.length === 0){
        statusEl.textContent = 'No designs found yet. Check back soon.';
        return;
      }

      originalOrder = files;

      statusEl.style.display = 'none';
      gridEl.style.display = 'grid';
      renderGrid(files);

      // Warm the browser image cache in the background (non-blocking) so drags feel snappy.
      files.forEach(f => loadImageMeta(rawUrl(f)));

    } catch(err){
      statusEl.textContent = '⚠️ ' + err.message;
      statusEl.classList.add('error');
      statusEl.style.display = 'block';
    }
  }

  loadImages();
})();
</script>

</body>
</html>
