<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Portfolio — Sanjay Meher</title>
<meta name="description" content="A collection of design work by Sanjay Meher, organized by orientation.">
<style>
  :root{
    --bg: #0c0e12;
    --panel: #15181f;
    --panel-2: #1c2029;
    --line: #262b35;
    --text: #eef0f3;
    --muted: #8b909c;
    --accent: #5ee6c8;
    --accent-dim: rgba(94,230,200,0.14);
    --danger: #ff6b6b;
    --radius: 8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height:100vh;
  }

  header{
    padding: 64px 20px 40px;
    text-align:center;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(94,230,200,0.07), transparent);
  }
  header .eyebrow{
    color: var(--accent);
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 10px;
  }
  header h1{
    margin:0 0 10px;
    font-size: clamp(2rem, 5vw, 3rem);
    letter-spacing: -0.02em;
    font-weight: 700;
  }
  header h1 span{ color: var(--accent); }
  header p{
    margin: 0 auto;
    max-width: 560px;
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.5;
  }

  main{
    max-width: 1300px;
    margin: 0 auto;
    padding: 8px 20px 40px;
  }

  #status{
    text-align:center;
    color: var(--muted);
    padding: 90px 20px;
    font-size: 0.95rem;
  }
  #status.error{ color: var(--danger); }

  .category{
    margin-top: 56px;
  }
  .category-head{
    display:flex;
    align-items:baseline;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .category-head h2{
    margin:0;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .category-head .count{
    color: var(--muted);
    font-size: 0.82rem;
  }

  /* Masonry via CSS columns so images keep their natural aspect ratio */
  .masonry{
    column-count: 1;
    column-gap: 14px;
  }
  @media (min-width: 560px){ .masonry{ column-count: 2; } }
  @media (min-width: 860px){ .masonry{ column-count: 3; } }
  @media (min-width: 1180px){ .masonry{ column-count: 4; } }

  .card{
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    margin: 0 0 14px;
    position:relative;
    background: var(--panel);
    border:1px solid var(--line);
    border-radius: var(--radius);
    overflow:hidden;
    cursor: zoom-in;
    transition: border-color .15s ease, transform .15s ease;
  }
  .card:hover{ border-color:#3a4150; transform: translateY(-2px); }

  .card img{
    display:block;
    width:100%;
    height:auto; /* preserves original aspect ratio */
  }

  .badge-num{
    position:absolute;
    top:8px; left:8px;
    background: rgba(12,14,18,0.78);
    color: var(--text);
    font-size: 0.72rem;
    font-weight:600;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    pointer-events:none;
  }

  /* Lightbox */
  #lightbox{
    position:fixed; inset:0;
    background: rgba(6,7,9,0.94);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 100;
    padding: 40px 20px;
  }
  #lightbox.show{ display:flex; }
  #lightbox img{
    max-width:100%;
    max-height:85vh;
    border-radius: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  #lightbox .lb-close{
    position:absolute;
    top:18px; right:22px;
    color: var(--text);
    font-size: 1.8rem;
    cursor:pointer;
    background:none;
    border:none;
    line-height:1;
  }
  #lightbox .lb-caption{
    position:absolute;
    bottom: 24px;
    color: var(--muted);
    font-size: 0.85rem;
  }

  footer{
    text-align:center;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 40px 16px 30px;
    border-top: 1px solid var(--line);
    margin-top: 40px;
  }
  footer a{ color: var(--accent); text-decoration:none; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Selected Work</div>
  <h1>Design <span>Portfolio</span></h1>
  <p>A collection of design work, organized by orientation. Tap any piece to view it full size.</p>
</header>

<main>
  <div id="status">Loading portfolio…</div>
  <div id="categories" style="display:none;"></div>
</main>

<div id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
  <img id="lbImg" src="" alt="">
  <div class="lb-caption" id="lbCaption"></div>
</div>

<footer>
  Built by <a href="https://cggodotassets.shop" target="_blank" rel="noopener">Sanjay Meher</a>
</footer>

<script>
(function(){
  const OWNER = "sanjaymeherdev";
  const REPO = "Godot-Website";
  const BRANCH = "main";
  const FOLDER_PATH = "designs/gallery";
  const IMAGE_EXT = /\.(jpe?g|png|gif|webp|avif|svg)$/i;

  // Aspect ratio categories, checked in order.
  // ratio = width / height
  const CATEGORY_ORDER = ["Landscape", "Square", "Portrait"];
  const CATEGORIES = {
    Landscape: { label: "Landscape", test: r => r > 1.15 },
    Square:    { label: "Square",    test: r => r >= 0.85 && r <= 1.15 },
    Portrait:  { label: "Portrait",  test: r => r < 0.85 }
  };

  const statusEl = document.getElementById('status');
  const categoriesEl = document.getElementById('categories');
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbCaption = document.getElementById('lbCaption');
  const lbClose = document.getElementById('lbClose');

  function rawUrl(filename){
    return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${FOLDER_PATH}/${encodeURIComponent(filename)}`;
  }

  function openLightbox(url, num){
    lbImg.src = url;
    lbCaption.textContent = `Design #${num}`;
    lightbox.classList.add('show');
  }
  function closeLightbox(){
    lightbox.classList.remove('show');
    lbImg.src = "";
  }
  lbClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e)=>{ if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeLightbox(); });

  function categorize(ratio){
    for(const key of CATEGORY_ORDER){
      if(CATEGORIES[key].test(ratio)) return key;
    }
    return "Square";
  }

  function buildCard(file, num, url){
    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.src = url;
    img.alt = `Design ${num}`;
    img.loading = 'lazy';

    const badge = document.createElement('div');
    badge.className = 'badge-num';
    badge.textContent = '#' + num;

    card.appendChild(img);
    card.appendChild(badge);
    card.addEventListener('click', () => openLightbox(url, num));
    return card;
  }

  const PROBE_TIMEOUT_MS = 8000;

  function loadImageMeta(url){
    return new Promise((resolve) => {
      let settled = false;
      const probe = new Image();

      const finish = (ratio) => {
        if(settled) return;
        settled = true;
        resolve(ratio);
      };

      probe.onload = () => finish(probe.naturalWidth / probe.naturalHeight);
      probe.onerror = () => finish(1); // fall back to square bucket if it fails to load

      // Don't let one slow/hanging image block the page forever.
      setTimeout(() => finish(1), PROBE_TIMEOUT_MS);

      probe.src = url;
    });
  }

  // Build (or fetch) the section + masonry container for a category, on demand.
  const sectionRefs = {};
  const sectionCounts = {};
  function ensureSection(key){
    if(sectionRefs[key]) return sectionRefs[key];

    const section = document.createElement('section');
    section.className = 'category';

    const head = document.createElement('div');
    head.className = 'category-head';
    const h2 = document.createElement('h2');
    h2.textContent = CATEGORIES[key].label;
    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = '0 pieces';
    head.appendChild(h2);
    head.appendChild(count);

    const masonry = document.createElement('div');
    masonry.className = 'masonry';

    section.appendChild(head);
    section.appendChild(masonry);

    // Keep sections in a stable, predictable order regardless of arrival order.
    const idx = CATEGORY_ORDER.indexOf(key);
    let inserted = false;
    for(const child of categoriesEl.children){
      if(CATEGORY_ORDER.indexOf(child.dataset.key) > idx){
        categoriesEl.insertBefore(section, child);
        inserted = true;
        break;
      }
    }
    if(!inserted) categoriesEl.appendChild(section);
    section.dataset.key = key;

    sectionRefs[key] = { section, masonry, countEl: count };
    sectionCounts[key] = 0;
    return sectionRefs[key];
  }

  function addCardToCategory(key, file, num, url){
    const ref = ensureSection(key);
    ref.masonry.appendChild(buildCard(file, num, url));
    sectionCounts[key] += 1;
    ref.countEl.textContent = `${sectionCounts[key]} piece${sectionCounts[key] === 1 ? '' : 's'}`;
  }

  async function loadImages(){
    try{
      const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER_PATH}`;
      const res = await fetch(apiUrl, {
        headers: { 'Accept': 'application/vnd.github+json' }
      });

      if(!res.ok){
        if(res.status === 404){
          throw new Error(`Folder not found. Make sure "${FOLDER_PATH}" exists in the repo.`);
        }
        if(res.status === 403){
          throw new Error('GitHub API rate limit reached. Please try again in a bit.');
        }
        throw new Error(`GitHub API error (${res.status})`);
      }

      const data = await res.json();
      const files = data
        .filter(item => item.type === 'file' && IMAGE_EXT.test(item.name))
        .sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'}));

      if(files.length === 0){
        statusEl.textContent = 'No designs found yet. Check back soon.';
        return;
      }

      statusEl.style.display = 'none';
      categoriesEl.style.display = 'block';

      // Render each image's card as soon as its own aspect ratio is known,
      // instead of waiting for the whole batch — one slow image no longer
      // blocks the rest of the portfolio from appearing.
      let done = 0;
      await Promise.all(files.map(async (file, idx) => {
        const num = idx + 1;
        const url = rawUrl(file.name);
        const ratio = await loadImageMeta(url);
        addCardToCategory(categorize(ratio), file, num, url);
        done += 1;
      }));

    } catch(err){
      statusEl.textContent = '⚠️ ' + err.message;
      statusEl.classList.add('error');
      statusEl.style.display = 'block';
    }
  }

  loadImages();
})();
</script>

</body>
</html>
