    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #fafafa;
            color: #262626;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #e0e0e0;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #8e8e8e;
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }

        .reels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem 1.5rem;
            justify-items: center;
        }

        .reel-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            padding: 1rem 1rem 0.5rem 1rem;
        }

        .reel-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        }

        /* The embed container - this works without iframes */
        .embed-container {
            min-height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f8f8;
            border-radius: 10px;
            overflow: hidden;
        }

        .embed-container blockquote {
            margin: 0 !important;
            width: 100% !important;
            min-width: 100% !important;
        }

        .reel-label {
            display: block;
            text-align: center;
            font-size: 0.75rem;
            color: #8e8e8e;
            margin-top: 0.75rem;
            padding-bottom: 0.25rem;
            letter-spacing: 0.3px;
        }

        .footer {
            text-align: center;
            margin-top: 3.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #dbdbdb;
            color: #8e8e8e;
            font-size: 0.9rem;
        }

        .footer a {
            color: #405de6;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.6rem;
            }
            .reels-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .embed-container {
                min-height: 400px;
            }
        }
    </style>
</head>
