<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanjay's Reels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #405de6, #833ab4, #e1306c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .reels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            justify-items: center;
        }
        .reel-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 1rem;
            width: 100%;
            max-width: 400px;
            transition: transform 0.2s;
        }
        .reel-card:hover {
            transform: translateY(-4px);
        }
        .embed-wrapper {
            min-height: 400px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 400px;
            color: #999;
            font-size: 0.9rem;
        }
        .reel-card iframe {
            width: 100% !important;
            height: 480px !important;
            border: none !important;
        }
        .footer {
            text-align: center;
            margin-top: 3rem;
            color: #8e8e8e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ AI Video Reels</h1>
            <p>by <strong>@freelance.sanjay</strong></p>
        </div>

        <div class="reels-grid" id="reelsGrid">
            <!-- Reels will be loaded here by JavaScript -->
            <div class="loading">Loading reels...</div>
        </div>

        <div class="footer">
            <a href="https://www.instagram.com/freelance.sanjay/" target="_blank">
                Follow @freelance.sanjay on Instagram
            </a>
        </div>
    </div>

    <script>
        // List of all Reel URLs
        const reelUrls = [
            'https://www.instagram.com/freelance.sanjay/reel/Dbe3bXls-Vm/',
            'https://www.instagram.com/freelance.sanjay/reel/DbZvbOsMomW/',
            'https://www.instagram.com/freelance.sanjay/reel/DbcistBMBdb/',
            'https://www.instagram.com/freelance.sanjay/reel/DbWJc4bS9hI/',
            'https://www.instagram.com/freelance.sanjay/reel/DbSAdbtsSXD/',
            'https://www.instagram.com/freelance.sanjay/reel/DbLZL7is2Sc/',
            'https://www.instagram.com/freelance.sanjay/reel/DbBluUpygxa/',
            'https://www.instagram.com/freelance.sanjay/reel/DbIz3o2ML7M/',
            'https://www.instagram.com/freelance.sanjay/reel/DaDQVOasR8i/',
            'https://www.instagram.com/freelance.sanjay/reel/DaF8eUoPhe4/',
            'https://www.instagram.com/freelance.sanjay/reel/DaIU0uEMpW3/',
            'https://www.instagram.com/freelance.sanjay/reel/DbFOJ5jSRlL/',
            'https://www.instagram.com/freelance.sanjay/reel/DbkNnGKMfqs/'
        ];

        // Function to fetch and display each reel
        async function loadReels() {
            const grid = document.getElementById('reelsGrid');
            grid.innerHTML = ''; // Clear loading message

            for (const url of reelUrls) {
                const card = document.createElement('div');
                card.className = 'reel-card';
                
                const wrapper = document.createElement('div');
                wrapper.className = 'embed-wrapper';
                wrapper.innerHTML = '<div class="loading">Loading...</div>';
                
                card.appendChild(wrapper);
                grid.appendChild(card);

                try {
                    // Fetch embed HTML from Instagram's oEmbed API via proxy
                    const response = await fetch(
                        `https://api.instagram.com/oembed?url=${encodeURIComponent(url)}`
                    );
                    
                    if (!response.ok) throw new Error('Failed to fetch embed');
                    
                    const data = await response.json();
                    
                    // Insert the embed HTML
                    wrapper.innerHTML = data.html;
                    
                    // Execute any scripts in the embed
                    const scripts = wrapper.querySelectorAll('script');
                    scripts.forEach(script => {
                        const newScript = document.createElement('script');
                        newScript.textContent = script.textContent;
                        document.body.appendChild(newScript);
                    });

                } catch (error) {
                    console.error('Error loading reel:', url, error);
                    wrapper.innerHTML = `
                        <div style="padding:2rem;text-align:center;color:#e1306c;">
                            ⚠️ Could not load reel<br>
                            <small><a href="${url}" target="_blank">View on Instagram</a></small>
                        </div>
                    `;
                }
            }
        }

        // Load reels when page is ready
        document.addEventListener('DOMContentLoaded', loadReels);
    </script>
</body>
</html>
